%SKELETON
{% set dataProductMajorVersion = parameters.identifier.split(".")[2] %}
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.identifier }}
  description: ${{ parameters.description | dump }}
  annotations:
    gitlab.com/project-slug: ${{ values.repoGroup + "/" + values.repoName }}
    backstage.io/techdocs-ref: dir:.
  tags:
    - outputport
    - vast
    - sql
spec:
  type: outputport
  lifecycle: experimental
  owner: ${{ parameters.owner | dump }}
  system: ${{ values.dataproduct | dump }}
  domain: ${{ values.domain | dump }}
  mesh:
    name: ${{ parameters.name | dump }}
    fullyQualifiedName: ${{ (parameters.domainName + " - " + parameters.dataproductName + " - version " + dataProductMajorVersion + " - " + parameters.name) | dump }}
    description: ${{ parameters.description | dump }}
    kind: outputport
    version: ${{ dataProductMajorVersion + ".0.0" }}
    infrastructureTemplateId: ${{ values.infrastructureTemplateId }}
    useCaseTemplateId: ${{ values.useCaseTemplateId }}
    dependsOn: {% if parameters.dependsOn and parameters.dependsOn | length > 0 %}{% for dependency in parameters.dependsOn %}
      - ${{ dependency | dump }}{% endfor %}{% else %}[]{% endif %}
    platform: Vast Data
    technology: table
    outputPortType: SQL
    creationDate: ${{ parameters.creationDate }}
    startDate: ${{ parameters.creationDate }}
    processDescription: ${{ parameters.processDescription | dump }}
    dataContract:
      schema: {% if values.schemaColumns | length > 0 %}{% for column in values.schemaColumns %}
        - name: ${{ column.name }}
          dataType: ${{ column.dataType }}
          description: ${{ column.description | dump }}
        {% if column.dataLength %}
          dataLength: ${{ column.dataLength }}
        {% endif %}
        {% if column.dataTypeDisplay %}
          dataTypeDisplay: ${{ column.dataTypeDisplay | dump }}
        {% endif %}
        {% if column.arrayDataType %}
          arrayDataType: ${{ column.arrayDataType }}
        {% endif %}{% endfor %}{% else %}[]{% endif %}
      termsAndConditions: ${{ parameters.termsAndConditions | dump }}
      endpoint: ${{ parameters.endpoint | dump }}
      SLA:
        intervalOfChange: ${{ parameters.intervalOfChange | dump }}
        timeliness: ${{ parameters.timeliness | dump }}
        upTime: ${{ parameters.upTime | dump }}
    dataSharingAgreements:
      purpose: ${{ parameters.purpose | dump }}
      billing: ${{ parameters.billing | dump }}
      security: ${{ parameters.security | dump }}
      intendedUsage: ${{ parameters.intendedUsage | dump }}
      limitations: ${{ parameters.limitations | dump }}
      lifeCycle: ${{ parameters.lifeCycle | dump }}
      confidentiality: ${{ parameters.confidentiality | dump }}
    tags: []
    sampleData: {}
    semanticLinking: []
    specific:
      database_name: ${{ values.database_name }}
      schema_name: ${{ values.schema_name }}
      table_name: ${{ values.table_name }}
      path: ${{ values.path }}
      policy_name: ${{ values.policy_name }}
      bucket_name: ${{ values.bucket_name }}
      vip_pool: ${{ values.vip_pool }}
